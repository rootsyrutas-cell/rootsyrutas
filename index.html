<style>
  .page { 
    display: none !important; 
    visibility: hidden !important;
    height: 0 !important;
    overflow: hidden !important;
  }
  .page.active { 
    display: block !important; 
    visibility: visible !important;
    height: auto !important;
    overflow: visible !important;
  }

/* ── STORY CAROUSEL ── */
.story-split {
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:start;
}
.story-carousel-wrap {
  position:sticky;
  top:0;
  overflow:hidden;
  height:520px;
}
.story-carousel-track {
  display:flex;
  width:300%;
  animation:story-slide 12s steps(1,end) infinite;
}
@keyframes story-slide {
  0%        { transform:translateX(0); }
  33.333%   { transform:translateX(-33.333%); }
  66.666%   { transform:translateX(-66.666%); }
  99.999%   { transform:translateX(0); }
}
.story-slide { width:33.333%; flex-shrink:0; }
.story-slide img { width:100%; height:520px; object-fit:cover; display:block; }
.story-text-stack { padding:56px 48px; }
.story-entry { margin-bottom:56px; padding-bottom:56px; border-bottom:1px solid rgba(13,26,28,0.08); }
.story-entry:last-child { margin-bottom:0; padding-bottom:0; border-bottom:none; }
@media(max-width:768px){
  .story-split { grid-template-columns:1fr; }
  .story-carousel-wrap { position:relative; height:280px; }
  .story-slide img { height:280px; }
  .story-text-stack { padding:40px 24px; }
}

/* ── RUTAS CAROUSEL ── */
.rutas-carousel-wrap { overflow:hidden; position:relative; }
.rutas-carousel-track { display:flex; width:200%; height:100%; animation:rutas-slide 8s steps(1,end) infinite; }
.rutas-slide { width:50%; flex-shrink:0; }
.rutas-slide img { width:100%; height:100%; object-fit:cover; display:block; }
@keyframes rutas-slide {
  0%     { transform:translateX(0); }
  50%    { transform:translateX(-50%); }
  99.9%  { transform:translateX(-50%); }
  100%   { transform:translateX(0); }
}

/* ── ROOTS CAROUSEL ── */
.roots-carousel-wrap { overflow:hidden; position:relative; }
.roots-carousel-track { display:flex; width:400%; height:100%; animation:roots-slide 16s steps(1,end) infinite; }
.roots-slide { width:25%; flex-shrink:0; }
.roots-slide img { width:100%; height:100%; object-fit:cover; display:block; }
@keyframes roots-slide {
  0%    { transform:translateX(0); }
  25%   { transform:translateX(-25%); }
  50%   { transform:translateX(-50%); }
  75%   { transform:translateX(-75%); }
  99.9% { transform:translateX(-75%); }
  100%  { transform:translateX(0); }
}

/* ── SECTION CAROUSELS (shared) ── */
.rry-carousel-wrap { overflow:hidden; position:relative; }
.rry-carousel-track { display:flex; height:100%; animation-duration:10s; animation-timing-function:steps(1,end); animation-iteration-count:infinite; }
.rry-slide { flex-shrink:0; }
.rry-slide img { width:100%; height:100%; object-fit:cover; display:block; }

/* 2-slide (Rutas) */
@keyframes rutas-car-slide {
  0%    { transform:translateX(0); }
  50%   { transform:translateX(-50%); }
  99.9% { transform:translateX(-50%); }
  100%  { transform:translateX(0); }
}
.rry-carousel-track[style*="rutas-car-slide"] { width:200%; }
.rry-carousel-track[style*="rutas-car-slide"] .rry-slide { width:50%; }

/* 3-slide (RootsyRutas) */
@keyframes rry-car-slide {
  0%      { transform:translateX(0); }
  33.33%  { transform:translateX(-33.333%); }
  66.66%  { transform:translateX(-66.666%); }
  99.9%   { transform:translateX(-66.666%); }
  100%    { transform:translateX(0); }
}
.rry-carousel-track[style*="rry-car-slide"] { width:300%; }
.rry-carousel-track[style*="rry-car-slide"] .rry-slide { width:33.333%; }
/* ¿Y ahora qué? feature on the home page */

<style>
/* ─────────────────────────────────────────────

:root {
  /* Pulled directly from the photos */
  --teal:     #1a6b72;   /* from Brazil water */
  --sand:     #c9a96e;   /* from boat wood */
  --warm:     #e8956d;   /* from sunset skin tones */
  --deep:     #0d1a1c;   /* near black */
  --off-white:#f7f4ef;   /* warm white */
  --mid:      #6b7c7e;   /* muted teal-gray */
  --gold:     #d4a843;   /* Daniela's balloons */
  --green:    #4a7c4e;   /* your golden hour photo */
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:auto; }
.page { display:none; }
.page.active { display:block; }

body {
  font-family:'Plus Jakarta Sans', sans-serif;
  font-size:17px;
  background:var(--off-white);
  color:var(--deep);
  overflow-x:hidden;
}
/* ── NAV ── */
nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 56px;
  mix-blend-mode:normal;
  transition:all 0.4s, transform 0.35s ease;
}
nav.nav-hidden { transform:translateY(-100%); }
.nav-hamburger {
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:flex-end;
  gap:5px;
  width:32px;
  height:32px;
  background:none;
  border:none;
  cursor:pointer;
  padding:0;
  z-index:210;
  position:relative;
}
.nav-hamburger span {
  display:block;
  width:100%;
  height:2px;
  background:white;
  transition:transform 0.3s ease, opacity 0.3s ease, width 0.3s ease;
}
nav.scrolled .nav-hamburger span { background:var(--deep); }
.nav-hamburger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); width:100%; }
.nav-hamburger.open span:nth-child(2) { opacity:0; }
.nav-hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); width:100%; }
.mobile-menu {
  position:fixed;
  inset:0;
  background:var(--deep);
  z-index:205;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  visibility:hidden;
  transform:translateY(-16px);
  transition:opacity 0.35s ease, transform 0.35s ease, visibility 0s linear 0.35s;
}
.mobile-menu.open {
  opacity:1;
  visibility:visible;
  transform:translateY(0);
  transition:opacity 0.35s ease, transform 0.35s ease, visibility 0s linear 0s;
}
.mobile-menu-links { list-style:none; text-align:center; padding:0; margin:0; }
.mobile-menu-links li { margin:20px 0; }
.mobile-menu-links a {
  font-family:'Fraunces',serif;
  font-weight:300;
  font-size:30px;
  color:#FAF6EE;
  text-decoration:none;
  cursor:pointer;
  display:inline-flex;
  flex-direction:column;
  gap:4px;
  line-height:1.1;
}
.mobile-menu-links a em {
  font-family:'Crimson Pro',serif;
  font-style:italic;
  font-weight:400;
  font-size:14px;
  color:rgba(247,244,239,0.5);
}
.mobile-menu-links .mobile-nav-book {
  margin-top:8px;
  display:inline-block;
  background:var(--gold);
  color:var(--deep);
  padding:13px 34px;
  border-radius:2px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:2px;
  text-transform:uppercase;
}
@media(max-width:900px){
  .nav-hamburger { display:flex; }
}
nav.scrolled {
  background:rgba(247,244,239,0.97);
  backdrop-filter:blur(20px);
  padding:14px 56px;
  border-bottom:1px solid rgba(13,26,28,0.07);
}
.nav-logo {
  font-family:'Fraunces', serif;
  font-size:22px;
  font-weight:300;
  color:white;
  text-decoration:none;
  letter-spacing:1px;
  cursor:pointer;
  transition:color 0.4s;
}
nav.scrolled .nav-logo { color:var(--deep); }
.nav-logo em { font-style:italic; color:var(--gold); }
.nav-links { display:flex; gap:0; list-style:none; align-items:center; }
.nav-links a {
  text-decoration:none;
  font-size:14px;
  font-weight:400;
  color:rgba(255,255,255,0.75);
  letter-spacing:1px;
  text-transform:uppercase;
  transition:all 0.3s;
  padding:8px 9px;
  cursor:pointer;
  position:relative;
  white-space:nowrap;
}
nav.scrolled .nav-links a { color:rgba(13,26,28,0.55); }
.nav-links a:hover { color:var(--warm); }
nav.scrolled .nav-links a:hover { color:var(--teal); }
.nav-links a[data-es]::after {
  content:attr(data-es);
  position:absolute;
  top:100%;
  left:50%;
  transform:translate(-50%,2px);
  white-space:nowrap;
  font-family:'Crimson Pro',serif;
  font-style:italic;
  font-size:16px;
  font-weight:400;
  letter-spacing:0;
  text-transform:none;
  color:#FAF6EE;
  background:var(--deep);
  padding:6px 14px;
  border-radius:3px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.25s ease, transform 0.25s ease;
  z-index:200;
}
.nav-links a[data-es]:hover::after {
  opacity:1;
  transform:translate(-50%,8px);
}
.nav-book {
  background:transparent !important;
  border:1px solid rgba(255,255,255,0.45) !important;
  color:white !important;
  border-radius:2px;
  padding:8px 16px !important;
  margin-left:6px;
  white-space:nowrap;
  transition:all 0.3s !important;
}
.nav-book:hover { background:white !important; color:var(--deep) !important; }
nav.scrolled .nav-book {
  border-color:var(--teal) !important;
  color:var(--teal) !important;
}
nav.scrolled .nav-book:hover {
  background:var(--teal) !important;
  color:white !important;
}

/* ── PAGES ── */
/* ── HERO ── */
.hero {
  height:100vh;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
}
.hero-img {
  position:absolute;

.hero-content {

.hero-eyebrow {

/* ── INTRO STRIP ── */
.intro-strip {
  background:var(--deep);
  padding:28px 56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:32px;
  flex-wrap:wrap;
}
.intro-tagline {
  font-family:'Fraunces', serif;

.intro-stat {}

  font-family:'Fraunces', serif;
  font-size:32px;

  font-size:15px;

/* ── FOUR PORTALS ── */
.portals {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  height:70vh;
  min-height:500px;
}
.portal {
  position:relative;
  overflow:hidden;
  cursor:pointer;
}
.portal-img {
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  transition:transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94);
}
.portal:hover .portal-img { transform:scale(1.05); }
.portal-overlay {
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(13,26,28,0.85) 0%, rgba(13,26,28,0.2) 60%, transparent 100%);

}

.portal-tag {

  font-weight:500;

.portal-cta {

  letter-spacing:2px;

}
.milestone-text {}
.milestone-who {

.milestone-what {

  line-height:1.5;
}
.milestone-what em { font-style:italic; opacity:0.6; font-size:14px; }

/* ── SECTION DIVIDER ── */

  padding:72px 56px;
  background:var(--off-white);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;
  align-items:center;
}
.divider-headline {
  font-family:'Fraunces', serif;
  font-size:clamp(36px,5vw,64px);

  letter-spacing:-1px;
  color:var(--deep);
}
.divider-headline em { font-style:italic; color:var(--teal); }

        <div class="person-role" style="color:var(--warm);font-style:italic;">where we began</div>
        <p class="person-bio" style="font-size:28px;">We&#8217;re Anabel, Daniela, Daniel, and Hector. Two sisters, a brother, and a brother-in-law who between us have lived the immigrant experience, grown up first-gen, and carved our own path.</p>
        <p class="person-bio" style="font-size:28px;">Nobody handed us a playbook for college, careers, or building wealth, so we went looking for one. Mentors, scholarships, nonprofits, people who believed in us before we had the language for what we were building. They opened doors. We walked through them.</p>

        <div class="person-role" style="color:var(--warm);font-style:italic;">the road we built</div>
        
<p class="person-bio" style="font-size:28px;">The people who believed in us came from everywhere: teachers, community organizations like YDO, mentors, and programs at places like Phillips Academy, Syracuse, Harvard, and Stanford that nobody in our circles had access to. Scholarships like Posse, QuestBridge, and Coca-Cola got us to college. Study abroad across five continents, a Fulbright, and careers in nonprofits and government kept our world expanding.</p>        <p class="person-bio" style="font-size:28px;">But the things that changed us most aren&#8217;t on a resume. We paid off debt and built wealth through investing and property. We built healthy lifestyles from scratch, starting with a $20-a-year rec center membership because that&#8217;s all we could afford. We learned to travel with intention, immerse ourselves in new languages and cultures, and live with less noise. We kept learning long after school ended, and reclaimed the art and music we were always told weren&#8217;t practical. We built lives our younger selves wouldn&#8217;t have believed were possible.</p>

<p class="person-bio" style="font-size:28px;">The opportunities that changed our lives weren&#8217;t things we found alone. We went looking, people showed up, and as a family, we shared everything with each other. Roots y Rutas is how we share it with you.</p>        <p class="person-bio" style="font-size:28px;">We take a holistic approach because your career, money, health, sense of adventure, and creativity aren&#8217;t separate tracks. They feed each other. So we share what we&#8217;ve learned across all of it: how to earn opportunities that feel out of reach, build real wealth, get healthier, travel with intention, and keep your creativity alive.</p>        <p class="person-bio" style="font-size:28px;">It&#8217;s for the immigrant building a life in a new system. The first-gen professional figuring out career and finances without a guide. The person who wants to travel the world but doesn&#8217;t know where to start. The one who never stopped loving art or music but was told it wasn&#8217;t practical. The person ready to start their health journey, or ready to take it further.</p>        <p class="person-bio" style="font-weight:500;color:var(--deep);font-size:28px;">We&#8217;ve been where you are. Let&#8217;s build your path forward, together.</p>

<script>
// Page templates stored in script tags, loaded on demand
function showPage(page, opts) {
  opts = opts || {};
  var tpl = document.getElementById('tpl-page-' + page);
  if (!tpl) { page = 'home'; tpl = document.getElementById('tpl-page-home'); }

  // Clear and inject
  var app = document.getElementById('app');
  app.innerHTML = tpl.innerHTML;

  // Keep the URL and browser history in sync so back/forward work
  if (!opts.skipHistory) {
    var url = page === 'home' ? '#' : '#' + page;
    if (opts.replace) {
      history.replaceState({ page: page }, '', url);
    } else {
      history.pushState({ page: page }, '', url);
    }
  }

  // Scroll to top immediately
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
  window.scrollTo(0, 0);
  
  // Update nav state
  document.getElementById('mainNav').classList.remove('scrolled');
  document.getElementById('mainNav').classList.remove('nav-hidden');
  lastScrollY = 0;
  closeMobileMenu();

  // Re-run reveal observer on new content
  document.querySelectorAll('.reveal').forEach(function(el) {
    observer.observe(el);
  });

  // Re-run counter animation on new content
  document.querySelectorAll('.counter').forEach(function(el) {
    counterObserver.observe(el);
  });

  // Update sticky CTA visibility
  var sticky = document.getElementById('stickyCTA');
  if (sticky) {
    sticky.classList.remove('visible');
  }
}

// Browser back/forward: re-render the page without pushing a new history entry
window.addEventListener('popstate', function(e) {
  var page = (e.state && e.state.page) || (location.hash ? location.hash.slice(1) : 'home');
  showPage(page, { skipHistory: true });
});

// Mobile hamburger menu
function toggleMobileMenu() {
  var menu = document.getElementById('mobileMenu');
  var burger = document.getElementById('navHamburger');
  var isOpen = menu.classList.toggle('open');
  burger.classList.toggle('open', isOpen);
  document.body.style.overflow = isOpen ? 'hidden' : '';
}
function closeMobileMenu() {
  var menu = document.getElementById('mobileMenu');
  var burger = document.getElementById('navHamburger');
  if (menu) menu.classList.remove('open');
  if (burger) burger.classList.remove('open');
  document.body.style.overflow = '';
}

// Nav scroll effect
var lastScrollY = 0;
window.addEventListener('scroll', function() {
  var nav = document.getElementById('mainNav');
  if (window.scrollY > 60) nav.classList.add('scrolled');
  else nav.classList.remove('scrolled');

  // Hide nav on scroll down, show on scroll up
  if (window.scrollY > lastScrollY && window.scrollY > 140) {
    nav.classList.add('nav-hidden');
  } else {
    nav.classList.remove('nav-hidden');
  }
  lastScrollY = window.scrollY;

  // Sticky CTA
  var sticky = document.getElementById('stickyCTA');
  if (sticky) {
    if (window.scrollY > 400) sticky.classList.add('visible');
    else sticky.classList.remove('visible');
  }
});

// Scroll reveal
var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.12 });

// Counter animation
function animateCounter(el) {
  var target = parseFloat(el.dataset.target);
  var suffix = el.dataset.suffix || '';
  var duration = 1800;
  var step = target / (duration / 16);
  var current = 0;
  var timer = setInterval(function() {
    current += step;
    if (current >= target) {
      current = target;
      clearInterval(timer);
    }
    el.textContent = (target % 1 !== 0 ? current.toFixed(1) : Math.floor(current)) + suffix;
  }, 16);
}

var counterObserver = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) {
      animateCounter(entry.target);
      counterObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.5 });

// Strategy Studio Accordion
function toggleAccWell(id) {
  var ids = ['well-pt','well-nutrition','well-perf','well-household'];
  ids.forEach(function(name) {
    var item = document.getElementById('acc-' + name);
    if (!item) return;
    if (name === id) { item.classList.toggle('acc-open'); }
    else { item.classList.remove('acc-open'); }
  });
}
function toggleAcc(id) {
  var ids = ['launchpad', 'proximo', 'legado'];
  ids.forEach(function(name) {
    var item = document.getElementById('acc-' + name);
    if (!item) return;
    if (name === id) {
      item.classList.toggle('acc-open');
    } else {
      item.classList.remove('acc-open');
    }
  });
}

// Load the page matching the current URL on start (falls back to home)
var initialPage = location.hash ? location.hash.slice(1) : 'home';
if (!document.getElementById('tpl-page-' + initialPage)) initialPage = 'home';
showPage(initialPage, { replace: true });
</script>
